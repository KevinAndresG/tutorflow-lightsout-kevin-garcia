services:
  tutorflow:
    build: .
    ports:
      # Solo loopback: la identidad viene del cuerpo sin autenticación (SPEC §8).
      - "127.0.0.1:8080:8080"
    # Las LLM_RESPALDO_N_* llegan solo vía .env (env_file).
    env_file:
      - path: .env
        required: false
    # Sin valor: se toman del entorno del anfitrión solo si existen; nunca hay llaves por defecto.
    environment:
      - LLM_API_KEY
      - LLM_PROVIDER
      - LLM_BASE_URL
      - LLM_MODEL
      - LLM_PRECIO_ENTRADA_MTOK
      - LLM_PRECIO_SALIDA_MTOK
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
